name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: "Install (slim, no PyTorch or sentence-transformers)"
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      # Regenerates the seeded synthetic data and prints per-module
      # precision/recall against the planted ground truth. Informational:
      # the script reports, it does not fail the build (review precision is
      # a known 0.4). Writes only to temp paths.
      - name: Seeded evals
        env:
          SQLITE_DB_PATH: ${{ runner.temp }}/ci.db
          CACHE_DB_PATH: ${{ runner.temp }}/ci_cache.db
          DECISION_LOG_PATH: ${{ runner.temp }}/ci.log.jsonl
        run: |
          python data/generate_synthetic_data.py
          python data/generate_intelligence_data.py
          python eval/run_intelligence_eval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm run build
