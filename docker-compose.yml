services:
  postgres:
    image: postgres:16-alpine
    container_name: commercesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercesense_db
      POSTGRES_USER: commercesense
      POSTGRES_PASSWORD: commercesense_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercesense -d commercesense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7-alpine
    container_name: commercesense-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
