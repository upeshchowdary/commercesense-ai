<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Copilot · Amazon Seller Intelligence & Control Room</title>
    <meta name="description" content="Autonomous Amazon Seller Copilot and Profitability Operating System — portfolio monitoring, competitor offers, pricing lab, and human-in-the-loop action center." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('seller-copilot-theme');
          if (t === 'dark') {
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
